name: Actelyo Suite installation and interoperability
on:
  workflow_dispatch:
  push:
    branches: [main, codex/unified-install-qa, codex/download-branding-qa]
    paths: ['suite/**', 'scripts/build-suite-kit.ps1', 'scripts/sync-download-catalog.cjs', 'tests/suite-core.ps1', 'tests/installed-branding.ps1', 'tests/download-portal.mjs', '.github/branding/**', '.github/workflows/qa-suite.yml', 'catalog.json', 'docs/desktop-catalog.json', 'docs/index.html']
  pull_request:
    paths: ['suite/**', 'scripts/build-suite-kit.ps1', 'scripts/sync-download-catalog.cjs', 'tests/suite-core.ps1', 'tests/installed-branding.ps1', 'tests/download-portal.mjs', '.github/branding/**', '.github/workflows/qa-suite.yml', 'catalog.json', 'docs/desktop-catalog.json', 'docs/index.html']
permissions:
  contents: read
concurrency:
  group: actelyo-suite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-suite:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Core contracts on PowerShell 5 and 7
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/suite-core.ps1
          if ($LASTEXITCODE) { throw 'Windows PowerShell core checks failed' }
          & pwsh -NoProfile -File tests/suite-core.ps1
          if ($LASTEXITCODE) { throw 'PowerShell core checks failed' }
      - name: Public portal fallback serves the corrected versions
        run: node scripts/sync-download-catalog.cjs --check
      - name: Restore locked QA dependencies
        run: npm ci --prefix suite/qa/runtime --ignore-scripts --no-audit --no-fund
      - name: Download cards stay current when the primary catalogue is unavailable
        env:
          ACTELYO_QA_PORTAL_OUT: suite-proof
        run: node tests/download-portal.mjs
      - name: Native icon comparator rejects blank and wrong-product icons
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/installed-branding.ps1 -SelfTest
          if ($LASTEXITCODE) { throw 'Native icon comparator checks failed' }
      - name: Build self-contained diagnostic kit
        run: ./scripts/build-suite-kit.ps1
      - name: Install every catalogued application and test real interoperability
        id: install
        run: |
          Copy-Item catalog.json suite/catalog.json
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File suite/Installer-ActelyoSuite.ps1 -Mode Install -IncludeTestModels -Accept -ReportDirectory "$env:GITHUB_WORKSPACE/suite-proof" -Destination "$env:RUNNER_TEMP/actelyo-packages"
          if ($LASTEXITCODE) { throw 'Suite installation or interoperability did not pass' }
      - name: Verify unmodified public installer, EXE and Windows shortcut logos
        if: success()
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/installed-branding.ps1 -InstalledJson suite-proof/installed.json
          if ($LASTEXITCODE) { throw 'Native installer or shortcut branding did not pass' }
      - name: Preserve evidence, including failed and blocked checks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actelyo-suite-windows-${{ github.run_id }}
          path: |
            suite-build/*.zip
            suite-build/kit-manifest.json
            suite-proof/installation.json
            suite-proof/installed.json
            suite-proof/qa.json
            suite-proof/rapport.html
            suite-proof/portal-fallback.json
            suite-proof/*.png
            suite-proof/*-install.log
            suite-proof/*-runtime.log
            suite-proof/branding/*.png
            suite-proof/branding/*.json
          retention-days: 14
