name: Diagnose published ERP installer destinations
on:
  workflow_dispatch:
  push:
    branches: [codex/verified-desktop-catalog]
    paths: [.github/workflows/qa-erp-installer.yml]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        destination: [default, profile, temporary]
    steps:
      - name: Install the unchanged public ERP binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'erp-diagnostic'
          New-Item -ItemType Directory -Path $out | Out-Null
          $file = Join-Path $out 'Actelyo-ERP-Desktop-Setup-1.8.4-x64.exe'
          Invoke-WebRequest 'https://github.com/jeanneretsamy-ux/actelyo-downloads/releases/download/desktop-erp-v1.8.4/Actelyo-ERP-Desktop-Setup-1.8.4-x64.exe' -OutFile $file
          if ((Get-FileHash $file -Algorithm SHA256).Hash -ne 'ff82b2d098af95262359baf9005e2830123e5b354a5eb5f262d356414873cc54') { throw 'Published bytes differ' }
          $mode = '${{ matrix.destination }}'
          $arguments = '/S'
          if ($mode -eq 'profile') { $arguments = '/S /currentuser /D=' + (Join-Path $env:LOCALAPPDATA 'Programs\Actelyo ERP') }
          if ($mode -eq 'temporary') { $arguments = '/S /D=' + (Join-Path $env:RUNNER_TEMP 'erp-installed') }
          $started = Get-Date
          $process = Start-Process -FilePath $file -ArgumentList $arguments -WindowStyle Hidden -PassThru
          $finished = $process.WaitForExit(120000)
          $records = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Actelyo ERP*' } | Select-Object DisplayName,DisplayVersion,InstallLocation)
          $events = @(Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started; Id=1000,1001} -ErrorAction SilentlyContinue | Select-Object Id,ProviderName,Message)
          @{ mode=$mode; arguments=$arguments; finished=$finished; exitCode=$(if($finished){$process.ExitCode}else{$null}); registrations=$records; events=$events } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'result.json')
          Get-Content (Join-Path $out 'result.json')
          if (-not $finished) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue; throw 'Synthetic CI installer timed out' }
          if ($process.ExitCode -ne 0 -or $records.Count -ne 1) { throw 'Published installer diagnostic failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: erp-installer-${{ matrix.destination }}
          path: ${{ runner.temp }}/erp-diagnostic/result.json
